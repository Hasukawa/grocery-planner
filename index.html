<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem 1rem 6rem;
    color: #222;
    background: #fafafa;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .week { color: #666; margin: 0 0 1.5rem; }
  .summary { margin: 0 0 1rem; padding: 0.5rem 0.75rem; background: #fff; border-radius: 6px; border: 1px solid #e0e0e0; font-size: 0.9rem; }
  .category {
    font-weight: 600;
    margin: 1.5rem 0 0.5rem;
    font-size: 0.85rem;
    color: #5a2d8c;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .item {
    display: flex;
    align-items: center;
    padding: 0.6rem 0.75rem;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    margin-bottom: 0.4rem;
    gap: 0.6rem;
  }
  .item.checked { background: #f4eef9; border-color: #c8a8e0; }
  .item input[type=checkbox] {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .item label {
    flex: 1;
    cursor: pointer;
    user-select: none;
  }
  .qty-wrap {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
  }
  .qty-btn {
    /* 44px tall = Apple's minimum comfortable tap target */
    width: 40px;
    height: 44px;
    flex: none;
    padding: 0;
    font-size: 1.35rem;
    line-height: 1;
    font-weight: 600;
    background: #f4eef9;
    color: #5a2d8c;
    border: none;
    border-radius: 0;
    cursor: pointer;
    /* stop iOS double-tap-to-zoom and long-press text selection */
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .qty-btn:active:not(:disabled) { background: #d9c2ee; }
  .qty-btn:disabled { background: #f5f5f5; color: #ccc; cursor: default; }
  .item .qty {
    width: 40px;
    height: 44px;
    padding: 0;
    border: none;
    border-left: 1px solid #e6e6e6;
    border-right: 1px solid #e6e6e6;
    font-size: 1rem;
    text-align: center;
    background: #fff;
    color: #222;
    /* iOS zooms the page if font-size < 16px on focus; 1rem = 16px avoids it */
    -webkit-appearance: none;
    appearance: none;
  }
  .item .qty:disabled { background: #f5f5f5; color: #aaa; }
  .qty-wrap:has(.qty:disabled) { border-color: #e0e0e0; }
  .controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 1rem;
    background: rgba(255, 255, 255, 0.96);
    border-top: 1px solid #ddd;
    backdrop-filter: blur(8px);
  }
  .controls-inner { max-width: 640px; margin: 0 auto; display: flex; gap: 0.75rem; align-items: center; }
  button {
    flex: 1;
    font-size: 1rem;
    padding: 0.85rem 1rem;
    background: #5a2d8c;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }
  button:active { background: #421f68; }
  .status { font-size: 0.85rem; color: #666; min-height: 1.2em; margin: 0; }
</style>

const QTY_MIN = 1;
const QTY_MAX = 20;

function upcomingWednesday() {
  const today = new Date();
  const day = today.getDay(); // 0=Sun .. 3=Wed .. 6=Sat
  const delta = (3 - day + 7) % 7;
  const wed = new Date(today);
  wed.setDate(today.getDate() + delta);
  return wed.toISOString().slice(0, 10);
}

document.getElementById('week').textContent = upcomingWednesday();

function render() {
  const container = document.getElementById('items');
  const groups = {};
  ITEMS.forEach((item, idx) => {
    const cat = item.category || 'Other';
    (groups[cat] ||= []).push({ ...item, idx });
  });

  for (const cat of Object.keys(groups).sort()) {
    const header = document.createElement('div');
    header.className = 'category';
    header.textContent = cat;
    container.appendChild(header);

    for (const item of groups[cat]) {
      const row = document.createElement('div');
      row.className = 'item';
      row.dataset.idx = item.idx;
      const safeName = escapeHtml(item.name);
      row.innerHTML = `
        <input type="checkbox" id="i${item.idx}" data-idx="${item.idx}">
        <label for="i${item.idx}">${safeName}</label>
        <div class="qty-wrap">
          <button type="button" class="qty-btn" data-step="-1" aria-label="Decrease quantity of ${safeName}" disabled>&minus;</button>
          <input type="text" inputmode="numeric" pattern="[0-9]*" class="qty"
                 value="${item.qty}" data-idx="${item.idx}"
                 aria-label="Quantity of ${safeName}" disabled>
          <button type="button" class="qty-btn" data-step="1" aria-label="Increase quantity of ${safeName}" disabled>+</button>
        </div>
      `;
      container.appendChild(row);

      const cb = row.querySelector('input[type=checkbox]');
      const qty = row.querySelector('input.qty');
      const btns = row.querySelectorAll('.qty-btn');

      // Keep the value in range and reflect min/max on the buttons.
      function clampQty(n) {
        return Math.min(QTY_MAX, Math.max(QTY_MIN, n));
      }
      function syncQty(n) {
        const v = clampQty(n);
        qty.value = String(v);
        const off = !cb.checked;
        btns[0].disabled = off || v <= QTY_MIN;
        btns[1].disabled = off || v >= QTY_MAX;
      }

      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          syncQty((parseInt(qty.value, 10) || QTY_MIN) + parseInt(btn.dataset.step, 10));
        });
      });

      // Typing directly still works; sanitise on the way out.
      qty.addEventListener('input', () => {
        qty.value = qty.value.replace(/[^0-9]/g, '');
      });
      qty.addEventListener('blur', () => {
        syncQty(parseInt(qty.value, 10) || QTY_MIN);
      });

      cb.addEventListener('change', () => {
        row.classList.toggle('checked', cb.checked);
        qty.disabled = !cb.checked;
        syncQty(parseInt(qty.value, 10) || QTY_MIN);
        updateCount();
      });

      syncQty(item.qty);
    }
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function updateCount() {
  const n = document.querySelectorAll('input[type=checkbox]:checked').length;
  document.getElementById('count').textContent = String(n);
}

function exportJson() {
  const selected = [];
  document.querySelectorAll('input[type=checkbox]:checked').forEach(cb => {
    const idx = parseInt(cb.dataset.idx, 10);
    const item = ITEMS[idx];
    const qtyInput = document.querySelector(`input.qty[data-idx="${idx}"]`);
    const entry = {
      name: item.name,
      qty: parseInt(qtyInput.value, 10) || 1,
      search_term: item.search_term,
    };
    if (item.notes) entry.notes = item.notes;
    selected.push(entry);
  });
  if (selected.length === 0) {
    document.getElementById('status').textContent = 'Nothing selected.';
    return;
  }
  const out = {
    week: document.getElementById('week').textContent,
    tier2_yes: selected,
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ocado_tuesday.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  document.getElementById('status').textContent = `Exported ${selected.length} items to ocado_tuesday.json`;
}

document.getElementById('export-btn').addEventListener('click', exportJson);

render();
updateCount();
